  <body class="bg-[#030303] text-[#F8FAFC] antialiased selection:bg-[#FF3030]/30 selection:text-white">
    <div id="root"></div>
    <script>
      (function (l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            '',
            l.pathname.replace(/\/$/, '') + decoded + l.hash
          );
        }
      })(window.location);
    </script>
