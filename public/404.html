<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RDS TECH FACT</title>
    <script>
      // Single Page App redirect for GitHub Pages project site (/rds-tech-fact-site/)
      // Keeps the repository segment and encodes the deep-link path into the query string
      // so index.html restores the exact route for React Router BrowserRouter.
      (function (l) {
        var pathSegmentsToKeep = 1;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
